<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自适应阅读辅助</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #fb { color: #e6e8ee; font: 14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;
        padding: 24px; display: none; }
  #fb code { background: #222834; padding: 1px 6px; border-radius: 4px; font: 12.5px monospace; }
  #fb p { color: #9aa0a6; font-size: 13px; }
</style>
</head>
<body>

<!--
  侧栏外壳（兜底用：正常情况下点扩展图标是在页面上开浮层，不走侧栏）。

  为什么是"扩展自己的页面 + iframe 指向同目录的 reader_flow.html"：
    扩展 API（chrome.*）只在【扩展自己的源】里存在。
    早先写成 <iframe src="http://127.0.0.1:8765/demo/reader_flow.html">，
    那个 iframe 的来源是本地服务器，于是界面里 chrome 是 undefined，
    一调用就报 "Cannot read properties of undefined"。

  注意：脚本必须放在外部 .js 文件里 ——
    MV3 扩展默认 CSP 是 script-src 'self'，内联 <script> 会被直接拦掉
    （报错 "Executing inline script violates the following Content Security Policy"）。
-->
<iframe id="frame" src="reader_flow.html?extract=1" title="阅读界面"></iframe>

<div id="fb">
  <h2 style="font-size:16px;margin:0 0 10px">读不到阅读界面</h2>
  <p>请先在项目目录执行同步脚本，然后重新加载扩展：</p>
  <p><code>python tools/sync_plugin.py</code></p>
</div>

<script src="panel.js"></script>
</body>
</html>
