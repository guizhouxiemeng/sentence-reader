<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>手部追踪精度测试 — 对比视线方案</title>
<style>
  :root { --bg:#0f1115; --fg:#e8eaed; --dim:#9aa0a6; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #wrap { position:absolute; inset:0; }
  #cam { position:absolute; right:12px; bottom:12px; width:300px; border-radius:10px;
    border:1px solid #2b3342; background:#000; transform:scaleX(-1); }
  #plot { position:absolute; left:0; top:0; width:60%; height:60%; }
  #hud { position:absolute; left:14px; top:14px; z-index:5; background:rgba(15,17,21,.86);
    border-radius:10px; padding:12px 16px; font-size:13px; line-height:1.85;
    font-variant-numeric:tabular-nums; max-width:520px; }
  #hud b { color:#e8eaed; }
  .ok { color:#4ade80; } .warn { color:#f5a623; } .bad { color:#ff6b6b; }
  #status { position:absolute; left:14px; bottom:14px; font-size:13px; color:var(--dim); }
  #panel { position:absolute; right:12px; top:12px; width:300px; background:rgba(15,17,21,.9);
    border:1px solid #2b3346; border-radius:10px; padding:12px 14px; font-size:12.5px;
    line-height:1.7; color:var(--dim); }
  #panel h3 { margin:0 0 8px 0; font-size:13.5px; color:#e8eaed; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:2px 4px; border-bottom:1px solid #232936; }
  td.k { color:#e8eaed; text-align:right; font-variant-numeric:tabular-nums; }
  button { background:var(--accent); color:#fff; border:0; padding:8px 14px; border-radius:8px;
    font-size:13px; font-weight:600; cursor:pointer; margin-top:8px; }
</style>
<script type="importmap">
{ "imports": { "@mediapipe/tasks-vision": "../vendor/vision_bundle.js" } }
</script>
</head>
<body>
<div id="wrap">
  <canvas id="plot"></canvas>
  <video id="cam" playsinline muted autoplay></video>
  <div id="hud">正在加载手部模型…</div>
  <div id="panel">
    <h3>手部追踪精度测试</h3>
    <div id="stats">—</div>
    <button id="btn-reset">重置统计</button>
    <div style="margin-top:10px;font-size:11.5px">
      操作：把食指举到镜头前，先<b style="color:#e8eaed">尽量稳住不动</b> 3 秒（测抖动），
      再<b style="color:#e8eaed">缓慢移动</b>覆盖画面范围（测动态范围）。
    </div>
  </div>
  <div id="status"></div>
</div>
<script type="module">
// ============================================================================
//  手部追踪精度测试
//
//  目的：用同一台摄像头、同一套 MediaPipe，量化"手指"相对"视线"的精度优势。
//  这是决定是否值得从视线方案转向"手指 / 视线+手指"的关键数据。
//
//  测两个量：
//   1. 静止抖动：手指保持不动时，关键点的帧间标准差（决定能否稳定停在一点）
//   2. 动态范围：手在画面内移动时，关键点覆盖的归一化范围（决定可控屏幕区域）
//  并换算成"在 1920x1080 屏幕上相当于多少像素" —— 与视线方案直接可比。
//
//  对照：视线方案实测 平均误差 400px（0.202 对角线）、静止抖动 L1=0.00065
// ============================================================================
const $ = (id) => document.getElementById(id);
const video = $('cam');
const plot = $('plot');
const pctx = plot.getContext('2d');

let landmarker = null;
let lastVideoTime = -1;
let frames = 0;

// 统计缓冲
const S = {
  tip: [],        // 食指指尖的历史点（归一化）
  jitMin: null,   // 滚动窗口抖动的最小值（= 你稳住时的抖动下限）
  jitLast: null,  // 当前滚动窗口抖动
  minX: 1, maxX: 0, minY: 1, maxY: 0,
};

function resize() {
  plot.width = innerWidth * 0.6;
  plot.height = innerHeight * 0.6;
}
addEventListener('resize', resize);
resize();

async function init() {
  try {
    const vision = await import('@mediapipe/tasks-vision');
    const fileset = await vision.FilesetResolver.forVisionTasks('../vendor/wasm');
    // 优先本地模型（已下载到 vendor/，避免被墙 + 离线可用），失败再退回官方 CDN
    const LOCAL = '../vendor/hand_landmarker.task';
    const CDN = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    let modelPath = LOCAL;
    try {
      const head = await fetch(LOCAL, { method: 'HEAD' });
      if (!head.ok) modelPath = CDN;
    } catch (e) { modelPath = CDN; }
    landmarker = await vision.HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: modelPath, delegate: 'GPU' },
      runningMode: 'VIDEO',
      numHands: 1,
    });
    $('hud').innerHTML = '手部模型已加载（' + (modelPath === LOCAL ? '本地' : 'CDN') +
      '），请把手举到镜头前。';
  } catch (e) {
    $('hud').innerHTML = '<span class="bad">手部模型加载失败：' + (e && e.message ? e.message : e) +
      '</span>';
    return;
  }

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false });
  video.srcObject = stream;
  await video.play();
  $('status').textContent = '运行中：把食指举到镜头前并保持稳定 3 秒，然后缓慢移动覆盖画面。';
  loop();
}

function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const t = performance.now();
  let res = null;
  try { res = landmarker.detectForVideo(video, t); } catch (e) { return; }
  frames++;

  pctx.clearRect(0, 0, plot.width, plot.height);
  // 背景网格
  pctx.strokeStyle = 'rgba(255,255,255,.07)';
  pctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    pctx.beginPath();
    pctx.moveTo(plot.width * i / 6, 0); pctx.lineTo(plot.width * i / 6, plot.height); pctx.stroke();
    pctx.beginPath();
    pctx.moveTo(0, plot.height * i / 6); pctx.lineTo(plot.width, plot.height * i / 6); pctx.stroke();
  }

  if (!res || !res.landmarks || !res.landmarks.length) {
    $('hud').innerHTML = '未检测到手。请把手举到镜头前，光照充足、手掌朝向镜头。' +
      `<br><span style="font-size:12px;color:#9aa0a6">已处理 ${frames} 帧</span>`;
    return;
  }
  const lm = res.landmarks[0];
  // 8 号点是食指指尖（MediaPipe Hand 21 点模型的 index_finger_tip）
  const tip = lm[8];
  const x = tip.x, y = tip.y;

  // 静止抖动测量：不用"必须完全静止 3 秒"的苛刻判据（手很难做到），
  // 改成【滚动窗口】持续测量，并记录历史最小值 —— 只要你在某一刻稳住了，
  // 那个最小值就是你的抖动下限。同时记录"当前"值，便于边动边看。
  S.tip.push({ x, y, t });
  if (S.tip.length > 900) S.tip.shift();

  // 取最近 1 秒的样本算 std（约 30 帧）
  const win = S.tip.filter(p => t - p.t < 1000);
  let jitter = null;
  if (win.length >= 8) {
    const xs = win.map(p => p.x), ys = win.map(p => p.y);
    jitter = Math.hypot(std(xs), std(ys));
    S.jitMin = S.jitMin === null ? jitter : Math.min(S.jitMin, jitter);
    S.jitLast = jitter;
  }

  // 轨迹
  pctx.strokeStyle = 'rgba(76,141,255,.8)';
  pctx.lineWidth = 1.4;
  pctx.beginPath();
  S.tip.forEach((p, i) => {
    const px = p.x * plot.width, py = p.y * plot.height;
    if (i === 0) pctx.moveTo(px, py); else pctx.lineTo(px, py);
  });
  pctx.stroke();
  // 当前点
  pctx.fillStyle = '#ff4d6d';
  pctx.beginPath();
  pctx.arc(x * plot.width, y * plot.height, 6, 0, Math.PI * 2);
  pctx.fill();

  // 手部骨架（简版连接）
  const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  pctx.strokeStyle = 'rgba(255,255,255,.28)';
  pctx.lineWidth = 1;
  for (const [a, b] of CONN) {
    const p = lm[a], q = lm[b];
    pctx.beginPath();
    pctx.moveTo(p.x * plot.width, p.y * plot.height);
    pctx.lineTo(q.x * plot.width, q.y * plot.height);
    pctx.stroke();
  }

  renderHud();
}

function std(a) {
  if (a.length < 2) return 0;
  const m = a.reduce((x, y) => x + y, 0) / a.length;
  return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length);
}

function renderHud() {
  // 动态范围：用全部历史轨迹算（手指覆盖过的区域）
  const xsAll = S.tip.map(p => p.x), ysAll = S.tip.map(p => p.y);
  const rangeX = xsAll.length ? Math.max(...xsAll) - Math.min(...xsAll) : 0;
  const rangeY = ysAll.length ? Math.max(...ysAll) - Math.min(...ysAll) : 0;

  const jit = S.jitLast;
  const jitMin = S.jitMin;
  const holdPx = jitMin !== null ? jitMin * 1920 : null;

  // 近 2 秒的活动范围（与视线 HUD 同口径，便于对比"在响应"还是"乱飘"）
  const now = performance.now();
  const recent = S.tip.filter(p => now - p.t < 2000);
  let recentRange = 0;
  if (recent.length >= 5) {
    const rx = recent.map(p => p.x), ry = recent.map(p => p.y);
    recentRange = Math.hypot(Math.max(...rx) - Math.min(...rx), Math.max(...ry) - Math.min(...ry));
  }

  $('hud').innerHTML =
    `<b>食指指尖</b> (${S.tip.length ? S.tip[S.tip.length - 1].x.toFixed(4) : '-'}, ` +
    `${S.tip.length ? S.tip[S.tip.length - 1].y.toFixed(4) : '-'})　帧 ${frames}<br>` +
    `近 2s 活动范围 ${recentRange.toFixed(4)}<br>` +
    `<b>静止抖动（当前）</b> ${jit !== null ? jit.toFixed(6) : '测量中…'}<br>` +
    `<b>静止抖动（最小值）</b> ${jitMin !== null ? jitMin.toFixed(6) : '测量中…'}` +
    `${holdPx !== null ? `　≈ <b>${holdPx.toFixed(1)} px</b> @1920×1080` : ''}<br>` +
    `<b>动态范围</b> x ${rangeX.toFixed(4)}　y ${rangeY.toFixed(4)}` +
    `　≈ ${(rangeX * 1920).toFixed(0)} × ${(rangeY * 1080).toFixed(0)} px<br>` +
    `<span style="font-size:12px;color:#9aa0a6">对照（视线方案实测）：` +
    `静止抖动 0.00065、平均误差 400px、动态范围 0.015</span>`;

  const rows = [
    ['静止抖动（最小值）', jitMin !== null ? jitMin.toFixed(6) : '—', '0.00065'],
    ['≈ 屏幕像素', holdPx !== null ? holdPx.toFixed(1) + ' px' : '—', '400 px'],
    ['动态范围 x', rangeX.toFixed(4), '0.0153'],
    ['动态范围 y', rangeY.toFixed(4), '0.0143'],
  ];
  $('stats').innerHTML = '<table><tr><td></td><td class="k">手指</td><td class="k">视线</td></tr>' +
    rows.map(r => `<tr><td>${r[0]}</td><td class="k">${r[1]}</td><td class="k" style="color:#9aa0a6">${r[2]}</td></tr>`).join('') +
    '</table>';
}

$('btn-reset').onclick = () => {
  S.tip = []; S.jitMin = null; S.jitLast = null;
  S.minX = 1; S.maxX = 0; S.minY = 1; S.maxY = 0;
};

init().catch(e => {
  $('hud').innerHTML = '<span class="bad">初始化失败：' + (e && e.message ? e.message : e) + '</span>';
});
</script>
</body>
</html>
